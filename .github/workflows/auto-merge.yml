name: Auto-merge new worlds

# A pull request that only adds one world, owned by its author and hosted on their own GitHub
# Pages site, merges itself once the "check" workflow passes. Anything else waits for review.
# pull_request_target runs this workflow from main with write access, so it never checks out or
# runs the pull request's code: auto-merge.js reads the proposed worlds.json as data only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # main, not the pull request
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node auto-merge.js
      - name: Merge when the check passes
        if: steps.rules.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash -R "${{ github.repository }}"
      - name: Explain why it needs a review
        if: steps.rules.outputs.ok != 'true' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.rules.outputs.reason }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" --body "Thanks! This one will be merged by hand after a quick review, because $REASON. Pull requests that only add one world, with \`owner\` set to your GitHub username and an address on your own \`https://<username>.github.io/\` site, merge automatically once the check passes."
